<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Unauthenticated JSON save path traversal</title>
  <desc id="desc">A client-controlled session directory reaches the writer, which reports success for a researcher-created second session and an existing writable directory beyond the intended session root.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121d31"/><stop offset="1" stop-color="#0b1221"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="none" stroke="#8ea4c5" stroke-width="1.5"/></marker>
    <marker id="warn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="none" stroke="#ffb56a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="380" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="378" rx="21" fill="none" stroke="#34455f"/>
  <text x="34" y="48" fill="#f1f5fc" font-family="Arial,sans-serif" font-size="24" font-weight="700">When a session ID becomes a path</text>
  <text x="34" y="76" fill="#afc2dc" font-family="Arial,sans-serif" font-size="15">The server reported a successful save outside the caller's own session.</text>

  <rect x="34" y="127" width="215" height="133" rx="15" fill="#172641" stroke="#5c7dad" stroke-width="2"/>
  <text x="56" y="159" fill="#8ad4ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Unauthenticated client</text>
  <text x="56" y="192" fill="#d6e3f3" font-family="Arial,sans-serif" font-size="16">JSON save request</text>
  <text x="56" y="221" fill="#d6e3f3" font-family="Consolas,monospace" font-size="16">sd = ../[session B]</text>

  <path d="M251 193h94" fill="none" stroke="#8ea4c5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="352" y="127" width="225" height="133" rx="15" fill="#172641" stroke="#7f6bbf" stroke-width="2"/>
  <text x="374" y="159" fill="#d7b4ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">JSON save handler</text>
  <text x="374" y="192" fill="#d6e3f3" font-family="Arial,sans-serif" font-size="16">Uses supplied directory</text>
  <text x="374" y="221" fill="#d6e3f3" font-family="Arial,sans-serif" font-size="16">without session binding</text>

  <path d="M579 174h63" fill="none" stroke="#ffb56a" stroke-width="2.5" marker-end="url(#warn)"/>
  <path d="M579 219h63" fill="none" stroke="#ffb56a" stroke-width="2.5" marker-end="url(#warn)"/>

  <rect x="650" y="113" width="274" height="91" rx="14" fill="#2a2630" stroke="#e9a669" stroke-width="2"/>
  <text x="672" y="145" fill="#ffd4a5" font-family="Arial,sans-serif" font-size="16" font-weight="700">Another test session</text>
  <text x="672" y="175" fill="#f3d6bc" font-family="Arial,sans-serif" font-size="15">Save reported successful</text>

  <rect x="650" y="218" width="274" height="91" rx="14" fill="#2a2630" stroke="#e9a669" stroke-width="2"/>
  <text x="672" y="249" fill="#ffd4a5" font-family="Arial,sans-serif" font-size="16" font-weight="700">Beyond session root</text>
  <text x="672" y="279" fill="#f3d6bc" font-family="Arial,sans-serif" font-size="15">Save reported successful</text>

  <text x="34" y="343" fill="#93a9c6" font-family="Arial,sans-serif" font-size="13">Researcher-owned sessions only · host and real session IDs withheld · saved file not read back</text>
</svg>
