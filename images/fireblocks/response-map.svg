<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">What the public Fireblocks health response exposed</title>
  <desc id="desc">A simplified map of the observed JSON response: AWS identity and storage, five SNS topics and five SQS queues, plus application service health and JVM memory telemetry. Identifying values are masked.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#17233b"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#233b63"/><stop offset="1" stop-color="#1b2c4c"/></linearGradient>
    <linearGradient id="queue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183d47"/><stop offset="1" stop-color="#1a303c"/></linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#392e54"/><stop offset="1" stop-color="#282c49"/></linearGradient>
  </defs>
  <rect width="1100" height="470" rx="26" fill="url(#background)"/>
  <rect x="22" y="22" width="1056" height="426" rx="20" fill="none" stroke="#36506c" stroke-width="2"/>
  <text x="48" y="67" fill="#a9c3e2" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">ONE ANONYMOUS GET /health RESPONSE</text>
  <rect x="47" y="91" width="302" height="292" rx="18" fill="url(#cloud)" stroke="#83a9e1" stroke-width="2"/>
  <circle cx="87" cy="131" r="19" fill="#618de4" opacity=".23"/>
  <path d="M78 139h20M82 133c0-7 8-12 14-7 5-1 8 3 8 7" fill="none" stroke="#bad4ff" stroke-width="3" stroke-linecap="round"/>
  <text x="117" y="137" fill="#f0f5ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Cloud identity</text>
  <text x="73" y="185" fill="#a9c4e9" font-family="Arial, sans-serif" font-size="19">AWS region</text>
  <text x="324" y="185" fill="#f0f5ff" font-family="Consolas, monospace" font-size="19" text-anchor="end">us-east-2</text>
  <path d="M73 202h251" stroke="#567093" opacity=".8"/>
  <text x="73" y="237" fill="#a9c4e9" font-family="Arial, sans-serif" font-size="19">Account ID</text>
  <rect x="212" y="218" width="112" height="26" rx="6" fill="#070c16"/>
  <text x="268" y="237" fill="#b8c4d8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">MASKED</text>
  <path d="M73 255h251" stroke="#567093" opacity=".8"/>
  <text x="73" y="293" fill="#a9c4e9" font-family="Arial, sans-serif" font-size="19">S3 storage</text>
  <text x="73" y="326" fill="#f0f5ff" font-family="Arial, sans-serif" font-size="18">Bucket name returned</text>
  <text x="73" y="355" fill="#a9c4e9" font-family="Arial, sans-serif" font-size="16">Exact name withheld here</text>
  <rect x="399" y="91" width="302" height="292" rx="18" fill="url(#queue)" stroke="#67d4c3" stroke-width="2"/>
  <circle cx="439" cy="131" r="19" fill="#4cc7b5" opacity=".23"/>
  <path d="M431 124h16M431 131h16M431 138h16" fill="none" stroke="#b5f4e9" stroke-width="3" stroke-linecap="round"/>
  <text x="469" y="137" fill="#f0f5ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Messaging map</text>
  <text x="425" y="188" fill="#a9e6dc" font-family="Arial, sans-serif" font-size="19">5 SNS topic ARNs</text>
  <text x="425" y="221" fill="#a9e6dc" font-family="Arial, sans-serif" font-size="19">5 SQS queue URLs</text>
  <path d="M425 245h251" stroke="#4e807c" opacity=".85"/>
  <text x="425" y="281" fill="#f0f5ff" font-family="Arial, sans-serif" font-size="18">Each entry reported</text>
  <text x="425" y="311" fill="#f0f5ff" font-family="Consolas, monospace" font-size="18">"healthy": true</text>
  <text x="425" y="354" fill="#a9e6dc" font-family="Arial, sans-serif" font-size="16">Names and URLs withheld here</text>
  <rect x="751" y="91" width="302" height="292" rx="18" fill="url(#runtime)" stroke="#bea6ef" stroke-width="2"/>
  <circle cx="791" cy="131" r="19" fill="#b592e8" opacity=".24"/>
  <path d="M783 141v-13l8-7 8 7v13M783 134h16" fill="none" stroke="#e0d0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="821" y="137" fill="#f0f5ff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Service state</text>
  <text x="777" y="188" fill="#dbcdf6" font-family="Arial, sans-serif" font-size="19">database + redis</text>
  <text x="777" y="220" fill="#dbcdf6" font-family="Arial, sans-serif" font-size="19">RabbitMQ components</text>
  <path d="M777 245h251" stroke="#786994" opacity=".85"/>
  <text x="777" y="281" fill="#f0f5ff" font-family="Arial, sans-serif" font-size="18">JVM heap + RSS</text>
  <text x="777" y="311" fill="#f0f5ff" font-family="Arial, sans-serif" font-size="18">usage and thresholds</text>
  <text x="777" y="354" fill="#dbcdf6" font-family="Arial, sans-serif" font-size="16">Live byte counts in response</text>
  <text x="48" y="422" fill="#aec3df" font-family="Arial, sans-serif" font-size="18">The same detailed component data also appeared under the response's <tspan fill="#e4d9fa" font-family="Consolas, monospace">info</tspan> key.</text>
</svg>
