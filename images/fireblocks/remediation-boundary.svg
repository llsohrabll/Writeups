<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Recommended health-check access boundary</title>
  <desc id="desc">A recommended design separates a small public availability answer from detailed diagnostics available only to authenticated operators. This is a proposed fix, not a claim about the deployed system.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#17243b"/></linearGradient>
  </defs>
  <rect width="1080" height="430" rx="26" fill="url(#back)"/>
  <rect x="27" y="27" width="1026" height="376" rx="19" fill="#17243a" stroke="#3b5572" stroke-width="2"/>
  <text x="54" y="68" fill="#a9c3e2" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">RECOMMENDED ACCESS BOUNDARY</text>
  <text x="54" y="101" fill="#d5e3f5" font-family="Arial, sans-serif" font-size="17">Conceptual remediation, not an observation about the current deployment</text>
  <rect x="54" y="130" width="464" height="225" rx="18" fill="#193b43" stroke="#65d4c5" stroke-width="2"/>
  <rect x="76" y="152" width="146" height="34" rx="17" fill="#2d655f"/>
  <text x="149" y="175" fill="#c8fff5" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">PUBLIC</text>
  <text x="77" y="224" fill="#edf8f7" font-family="Arial, sans-serif" font-size="24" font-weight="700">Unauthenticated visitor</text>
  <text x="77" y="258" fill="#a9e8df" font-family="Consolas, monospace" font-size="19">GET /health</text>
  <path d="M80 279h381" stroke="#4e857f"/>
  <text x="77" y="312" fill="#effaf8" font-family="Consolas, monospace" font-size="20">{ "status": "ok" }</text>
  <text x="77" y="337" fill="#a9e8df" font-family="Arial, sans-serif" font-size="16">No resource names or telemetry</text>
  <rect x="562" y="130" width="464" height="225" rx="18" fill="#342c4d" stroke="#bca4ea" stroke-width="2"/>
  <rect x="584" y="152" width="176" height="34" rx="17" fill="#655181"/>
  <text x="672" y="175" fill="#f1e5ff" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">OPERATOR ONLY</text>
  <text x="585" y="224" fill="#f4edff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Authenticated diagnostics</text>
  <text x="585" y="258" fill="#d7c4f4" font-family="Arial, sans-serif" font-size="19">Restricted internal route</text>
  <path d="M588 279h381" stroke="#826d9d"/>
  <text x="585" y="312" fill="#f4edff" font-family="Arial, sans-serif" font-size="19">Detailed component health</text>
  <text x="585" y="337" fill="#d7c4f4" font-family="Arial, sans-serif" font-size="16">Resource IDs and metrics stay private</text>
  <path d="M540 145v194" stroke="#7490af" stroke-width="2" stroke-dasharray="8 8" opacity=".75"/>
  <text x="54" y="384" fill="#a9c3e2" font-family="Arial, sans-serif" font-size="17">The public check answers availability; the private check supports troubleshooting.</text>
</svg>
