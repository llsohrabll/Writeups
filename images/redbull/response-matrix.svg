<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="510" viewBox="0 0 1024 510" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous Artifactory response matrix</title>
  <desc id="desc">Four unauthenticated read attempts. Repository listing, an HTML package index, and a direct npm archive download returned HTTP 200. A deep storage-list call returned HTTP 403. The successful archive download was 61,421 bytes and had gzip headers.</desc>
