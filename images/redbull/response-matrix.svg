  <text x="111" y="351" fill="#F4F8FE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Direct npm archive download</text>
  <text x="111" y="372" fill="#AFC2D9" font-family="Arial, Helvetica, sans-serif" font-size="13">61,421 bytes · application/x-gzip · 1f 8b magic bytes</text>
