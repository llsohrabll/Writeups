  <rect x="1" y="1" width="1022" height="508" rx="23" stroke="#28405C" stroke-width="2"/>
  <text x="42" y="54" fill="#F4F8FE" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Four read paths, one inconsistent policy</text>
  <text x="42" y="84" fill="#AFC2D9" font-family="Arial, Helvetica, sans-serif" font-size="15">All requests were unauthenticated during testing on September 19, 2026.</text>

  <rect x="42" y="116" width="940" height="48" rx="12" fill="#1E344A"/>
  <text x="70" y="146" fill="#AFC2D9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">READ OPERATION</text>
  <text x="719" y="146" fill="#AFC2D9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">OBSERVED</text>

  <rect x="42" y="173" width="940" height="66" rx="11" fill="#13233A" stroke="#34516B"/>
  <circle cx="75" cy="206" r="18" fill="#1F4F4E"/>
