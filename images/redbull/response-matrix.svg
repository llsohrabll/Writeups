  <text x="111" y="276" fill="#F4F8FE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">HTML repository index</text>
  <text x="111" y="297" fill="#AFC2D9" font-family="Arial, Helvetica, sans-serif" font-size="13">Browsable namespaces and package names</text>
  <rect x="716" y="261" width="112" height="40" rx="12" fill="#174C43"/>
  <text x="772" y="287" text-anchor="middle" fill="#9AF5E0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">200</text>
  <text x="847" y="287" fill="#9AF5E0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">VISIBLE</text>

