<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="610" viewBox="0 0 1024 610" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous repository inventory</title>
  <desc id="desc">Six local Artifactory repositories covering design systems, content clients, web engagement, partner projects, CLI tooling, and publishing or media components. Four virtual repositories were also listed. At least 83 package versions were identified across the local repositories.</desc>
