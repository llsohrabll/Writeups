<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">How anonymous credential issuance crossed a trust boundary</title>
  <desc id="desc">An unauthenticated caller reached a public mobile backend, which returned temporary AWS credentials for a production role. An AWS STS identity check succeeded. A CloudFront cache hit also showed a risk of sharing the credential response.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d30"/>
      <stop offset="1" stop-color="#0c1321"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d7c5"/>
      <stop offset="1" stop-color="#9ab9ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ab9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="600" rx="30" fill="url(#background)"/>
  <rect x="1" y="1" width="1098" height="598" rx="29" fill="none" stroke="#34445f" stroke-width="2"/>
  <text x="50" y="70" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700">Where the trust boundary broke</text>
  <text x="50" y="105" fill="#adbed3" font-family="Arial, Helvetica, sans-serif" font-size="19">The same request worked without a signed-in account or trusted client identity.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="50" y="150" width="280" height="245" rx="22" fill="#19283e" stroke="#3b5874" stroke-width="2"/>
    <circle cx="96" cy="199" r="22" fill="#55d7c5" opacity="0.17"/>
    <circle cx="96" cy="193" r="8" fill="none" stroke="#65e3d0" stroke-width="3"/>
    <path d="M82 211 C84 201 108 201 110 211" fill="none" stroke="#65e3d0" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="258" fill="#f3f7ff" font-size="27" font-weight="700">Anonymous caller</text>
    <text x="72" y="298" fill="#b9c9df" font-size="20">No login, cookie,</text>
    <text x="72" y="328" fill="#b9c9df" font-size="20">API key, or app proof</text>
    <rect x="72" y="349" width="110" height="28" rx="14" fill="#13483f"/>
    <text x="90" y="369" fill="#84f0db" font-size="15" font-weight="700">HTTP GET</text>

    <path d="M343 273 H389" stroke="#9ab9ff" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="410" y="150" width="280" height="245" rx="22" fill="#19283e" stroke="#3b5874" stroke-width="2"/>
    <rect x="434" y="177" width="46" height="42" rx="8" fill="#9ab9ff" opacity="0.18"/>
    <path d="M445 189 H469 M445 198 H463 M445 207 H467" stroke="#b4cbff" stroke-width="3" stroke-linecap="round"/>
    <text x="432" y="258" fill="#f3f7ff" font-size="27" font-weight="700">Mobile backend</text>
    <text x="432" y="298" fill="#b9c9df" font-size="20">Returns a full temporary</text>
    <text x="432" y="328" fill="#b9c9df" font-size="20">AWS credential set</text>
    <rect x="432" y="349" width="118" height="28" rx="14" fill="#49324f"/>
    <text x="450" y="369" fill="#f5b9f7" font-size="15" font-weight="700">200 OK</text>

    <path d="M703 273 H749" stroke="#9ab9ff" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="770" y="150" width="280" height="245" rx="22" fill="#19283e" stroke="#3b5874" stroke-width="2"/>
    <path d="M805 199 L821 183 L837 199 L821 215 Z" fill="none" stroke="#ffd284" stroke-width="3"/>
    <path d="M821 189 V208 M813 199 H829" stroke="#ffd284" stroke-width="2.5"/>
    <text x="792" y="258" fill="#f3f7ff" font-size="27" font-weight="700">AWS role session</text>
    <text x="792" y="298" fill="#b9c9df" font-size="20">Production identity</text>
    <text x="792" y="328" fill="#b9c9df" font-size="20">verified with STS only</text>
    <rect x="792" y="349" width="184" height="28" rx="14" fill="#473b27"/>
    <text x="808" y="369" fill="#ffdf9d" font-size="15" font-weight="700">No data accessed</text>

    <rect x="50" y="433" width="1000" height="112" rx="20" fill="#172941" stroke="#3e6084" stroke-width="2"/>
    <path d="M88 472 C78 460 94 448 102 460 C112 446 132 455 130 469 C148 468 149 489 133 491 H88 C71 491 71 475 88 472 Z" fill="none" stroke="#79c6f8" stroke-width="3"/>
    <text x="164" y="478" fill="#f3f7ff" font-size="23" font-weight="700">Shared CDN cache</text>
    <text x="164" y="512" fill="#b9c9df" font-size="19">A cache hit was observed; another caller could receive the same short-lived response.</text>
    <rect x="867" y="457" width="146" height="36" rx="18" fill="url(#accent)"/>
    <text x="891" y="481" fill="#112033" font-size="16" font-weight="700">Cache hit seen</text>
  </g>
</svg>
