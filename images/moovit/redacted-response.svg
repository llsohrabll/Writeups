<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
  <title id="title">Redacted reconstruction of the credential response</title>
  <desc id="desc">An illustrative HTTP 200 JSON response lists AccessKeyId, SecretAccessKey, SessionToken, and Expiration. Every value is hidden by a black bar. This is not the original evidence screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d30"/>
      <stop offset="1" stop-color="#0c1321"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="550" rx="30" fill="url(#background)"/>
  <rect x="1" y="1" width="1098" height="548" rx="29" fill="none" stroke="#34445f" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="70" fill="#f3f7ff" font-size="33" font-weight="700">What the response contained</text>
    <text x="50" y="105" fill="#adbed3" font-size="19">Illustrative redacted reconstruction - not the original evidence capture</text>
    <rect x="50" y="143" width="1000" height="340" rx="20" fill="#101827" stroke="#3a4d69" stroke-width="2"/>
    <path d="M70 143 H1030 Q1050 143 1050 163 V200 H50 V163 Q50 143 70 143 Z" fill="#202d43"/>
    <circle cx="83" cy="171" r="8" fill="#f18e91"/>
    <circle cx="110" cy="171" r="8" fill="#f3c470"/>
    <circle cx="137" cy="171" r="8" fill="#66d1aa"/>
    <text x="182" y="178" fill="#93e5c2" font-size="19" font-weight="700">HTTP 200 OK</text>
    <text x="75" y="246" fill="#9ab9ff" font-size="22">{</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#e6eeff">
      <text x="105" y="286">"AccessKeyId":</text>
      <text x="105" y="330">"SecretAccessKey":</text>
      <text x="105" y="374">"SessionToken":</text>
      <text x="105" y="418">"Expiration":</text>
    </g>
    <g fill="#020408" stroke="#677187" stroke-width="2">
      <rect x="341" y="262" width="265" height="30" rx="5"/>
      <rect x="341" y="306" width="412" height="30" rx="5"/>
      <rect x="341" y="350" width="570" height="30" rx="5"/>
      <rect x="341" y="394" width="300" height="30" rx="5"/>
    </g>
    <text x="75" y="458" fill="#9ab9ff" font-size="22">}</text>
    <text x="50" y="522" fill="#adbed3" font-size="18">Credential values, role and account identifiers, and endpoint details are intentionally omitted.</text>
  </g>
</svg>
